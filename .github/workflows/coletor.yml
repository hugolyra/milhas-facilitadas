name: coletor

on:
  schedule:
    - cron: "17 */2 * * *"   # a cada 2 horas (UTC), minuto 17 para fugir do pico
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coletor
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m coletor.run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Salvar dados no repositório
        run: |
          git config user.name "coletor-bot"
          git config user.email "coletor-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "dados: atualização automática"
          git push
